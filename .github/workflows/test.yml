on: [pull_request]
name: Test
env:
  GOPROXY: "https://proxy.golang.org"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version-file: 'go.mod'
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Lint
        run: go run golang.org/x/lint/golint@v0.0.0-20210508222113-6edffad5e616 -set_exit_status .
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -v -race ./...
