version: 2

builds:
  - env:
      # The macOS keychain backend is only compiled in with cgo, and darwin
      # is built natively on macOS runners, so cgo is available there.
      # Everything else stays statically linked.
      - CGO_ENABLED={{ if eq .Os "darwin" }}1{{ else }}0{{ end }}
    mod_timestamp: '{{ .CommitTimestamp }}'
    flags:
      - -trimpath
    asmflags:
      - all=-trimpath=$GOPATH
    gcflags:
      - all=-trimpath=$GOPATH
    ldflags:
      - -s -w -X github.com/jacobbednarz/cf-vault/cmd.Rev={{ .Version }}
    goos:
      - darwin
      - freebsd
      - linux
      - windows
archives:
  - formats:
      - zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_SHA256SUMS'
  algorithm: sha256
changelog:
  disable: true
